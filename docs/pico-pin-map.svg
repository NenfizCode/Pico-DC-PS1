<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img">
<title>Pico pin map for the Dreamcast to PlayStation adapter</title>
<desc>Raspberry Pi Pico drawn top-down with USB at the top. Only the pins that get a wire are labelled, each naming the connector pin it goes to. Pin 39 is the only pin that may carry 5 volts.</desc>
<style>
text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 600; } .ts { font-size: 12px; font-weight: 400; }
.leader { stroke: #9a988f; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
.hole { fill: #ffffff; stroke: #B4B2A9; stroke-width: 1; }
.gray rect { fill: #F1EFE8; stroke: #888780; stroke-width: 1; } .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; } .gray circle { fill: #D3D1C7; stroke: #888780; stroke-width: 1; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; } .teal circle { fill: #5DCAA5; stroke: #0F6E56; stroke-width: 1; }
.purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; } .purple circle { fill: #AFA9EC; stroke: #534AB7; stroke-width: 1; }
.red rect { fill: #FCEBEB; stroke: #A32D2D; stroke-width: 1.5; } .red .th { fill: #791F1F; } .red .ts { fill: #A32D2D; } .red circle { fill: #F09595; stroke: #A32D2D; stroke-width: 1; }
</style>
<rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
<rect x="250" y="40" width="180" height="405" rx="10" fill="#F7F6F2" stroke="#888780" stroke-width="1"/>
<g class="gray"><rect x="312" y="30" width="56" height="26" rx="3"/><text class="ts" x="340" y="47" text-anchor="middle">USB</text></g>
<circle class="hole" cx="263" cy="62" r="2.5"/>
<circle class="hole" cx="263" cy="81" r="2.5"/>
<circle class="hole" cx="263" cy="100" r="2.5"/>
<circle class="hole" cx="263" cy="119" r="2.5"/>
<circle class="hole" cx="263" cy="138" r="2.5"/>
<circle class="hole" cx="263" cy="157" r="2.5"/>
<circle class="hole" cx="263" cy="176" r="2.5"/>
<circle class="hole" cx="263" cy="195" r="2.5"/>
<circle class="hole" cx="263" cy="214" r="2.5"/>
<circle class="hole" cx="263" cy="233" r="2.5"/>
<circle class="hole" cx="263" cy="252" r="2.5"/>
<circle class="hole" cx="263" cy="271" r="2.5"/>
<circle class="hole" cx="263" cy="290" r="2.5"/>
<circle class="hole" cx="263" cy="347" r="2.5"/>
<circle class="hole" cx="263" cy="366" r="2.5"/>
<circle class="hole" cx="263" cy="385" r="2.5"/>
<circle class="hole" cx="263" cy="404" r="2.5"/>
<circle class="hole" cx="263" cy="423" r="2.5"/>
<circle class="hole" cx="417" cy="423" r="2.5"/>
<circle class="hole" cx="417" cy="404" r="2.5"/>
<circle class="hole" cx="417" cy="385" r="2.5"/>
<circle class="hole" cx="417" cy="366" r="2.5"/>
<circle class="hole" cx="417" cy="252" r="2.5"/>
<circle class="hole" cx="417" cy="214" r="2.5"/>
<circle class="hole" cx="417" cy="195" r="2.5"/>
<circle class="hole" cx="417" cy="176" r="2.5"/>
<circle class="hole" cx="417" cy="157" r="2.5"/>
<circle class="hole" cx="417" cy="138" r="2.5"/>
<circle class="hole" cx="417" cy="119" r="2.5"/>
<circle class="hole" cx="417" cy="62" r="2.5"/>
<g class="teal"><circle cx="263" cy="309" r="5"/><rect x="40" y="293" width="200" height="32" rx="4"/><text class="th" x="48" y="307">14 · GP10</text><text class="ts" x="48" y="320">10Ω → DC pin 1 · data A (SDCKA)</text></g>
<line class="leader" x1="258" y1="309" x2="240" y2="309"/>
<g class="teal"><circle cx="263" cy="328" r="5"/><rect x="40" y="329" width="200" height="32" rx="4"/><text class="th" x="48" y="343">15 · GP11</text><text class="ts" x="48" y="356">10Ω → DC pin 5 · data B (SDCKB)</text></g>
<line class="leader" x1="258" y1="328" x2="240" y2="345"/>
<g class="red"><circle cx="417" cy="81" r="5"/><rect x="440" y="65" width="200" height="32" rx="4"/><text class="th" x="448" y="79">39 · VSYS — the only 5V pin</text><text class="ts" x="448" y="92">Regulator output · DC pin 2 (+5V)</text></g>
<line class="leader" x1="422" y1="81" x2="440" y2="81"/>
<g class="gray"><circle cx="417" cy="100" r="5"/><rect x="440" y="101" width="200" height="32" rx="4"/><text class="th" x="448" y="115">38 · GND</text><text class="ts" x="448" y="128">Common ground bus</text></g>
<line class="leader" x1="422" y1="100" x2="440" y2="117"/>
<g class="purple"><circle cx="417" cy="233" r="5"/><rect x="440" y="217" width="200" height="32" rx="4"/><text class="th" x="448" y="231">31 · GP26</text><text class="ts" x="448" y="244">PSX pin 9 · ACK</text></g>
<line class="leader" x1="422" y1="233" x2="440" y2="233"/>
<g class="purple"><circle cx="417" cy="271" r="5"/><rect x="440" y="255" width="200" height="32" rx="4"/><text class="th" x="448" y="269">29 · GP22</text><text class="ts" x="448" y="282">PSX pin 7 · CLK</text></g>
<line class="leader" x1="422" y1="271" x2="440" y2="271"/>
<g class="gray"><circle cx="417" cy="290" r="5"/><rect x="440" y="291" width="200" height="32" rx="4"/><text class="th" x="448" y="305">28 · GND</text><text class="ts" x="448" y="318">PSX pin 4 · signal ground</text></g>
<line class="leader" x1="422" y1="290" x2="440" y2="307"/>
<g class="purple"><circle cx="417" cy="309" r="5"/><rect x="440" y="327" width="200" height="32" rx="4"/><text class="th" x="448" y="341">27 · GP21</text><text class="ts" x="448" y="354">PSX pin 6 · ATT / SEL</text></g>
<line class="leader" x1="422" y1="309" x2="440" y2="343"/>
<g class="purple"><circle cx="417" cy="328" r="5"/><rect x="440" y="363" width="200" height="32" rx="4"/><text class="th" x="448" y="377">26 · GP20</text><text class="ts" x="448" y="390">PSX pin 2 · CMD</text></g>
<line class="leader" x1="422" y1="328" x2="440" y2="379"/>
<g class="purple"><circle cx="417" cy="347" r="5"/><rect x="440" y="399" width="200" height="32" rx="4"/><text class="th" x="448" y="413">25 · GP19</text><text class="ts" x="448" y="426">PSX pin 1 · DATA</text></g>
<line class="leader" x1="422" y1="347" x2="440" y2="415"/>
</svg>